name: build (4 OS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache WiX Toolset (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri\WixTools314
          key: wix314-${{ runner.os }}-v1
          restore-keys: |
            wix314-${{ runner.os }}-

      - name: Enable .NET 3.5 for WiX 3.14 (candle.exe)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          Write-Host "Enabling NetFx3 for WiX 3.14..."
          try {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -ErrorAction Stop
            Write-Host "NetFx3 enabled"
          } catch {
            Write-Host "Enable-WindowsOptionalFeature failed, trying DISM fallback: $_"
            dism /online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart
          }
          # Pre-warm WiX to avoid flaky download during tauri build
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $wixDir = "$env:LOCALAPPDATA\tauri\WixTools314"
          $wixZip = "$env:RUNNER_TEMP\wix314.zip"
          if (-not (Test-Path "$wixDir\candle.exe")) {
            Write-Host "Pre-downloading WiX 3.14..."
            New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
            for ($i=1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip -UseBasicParsing
                Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
                Write-Host "WiX extracted to $wixDir"
                break
              } catch {
                Write-Host "Attempt $i failed: $_"
                if ($i -eq 3) { throw }
                Start-Sleep -Seconds 5
              }
            }
          } else {
            Write-Host "WiX cache hit at $wixDir"
          }
          Get-ChildItem $wixDir | Format-Table Name, Length

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev \
            zstd fakeroot libarchive-tools

      - name: Frontend install
        run: npm ci

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Arch Linux não tem target pacman nativo no CLI do Tauri:
      # empacotamos o AppImage num .pkg.tar.zst válido.
      - name: Pacote pacman (Arch Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          ICON=src-tauri/icons/128x128.png
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT_DIR=src-tauri/target/release/bundle/pacman
          RELEASE=onpoint-${VERSION}-1-x86_64.pkg.tar.zst
          ROOT=$(mktemp -d)

          install -Dm755 "$APPIMAGE" "$ROOT/usr/bin/onPoint.AppImage"
          install -Dm644 "$ICON" "$ROOT/usr/share/icons/hicolor/128x128/apps/onpoint.png"
          mkdir -p "$ROOT/usr/share/applications"
          cat > "$ROOT/usr/share/applications/onPoint.desktop" <<EOF
          [Desktop Entry]
          Name=onPoint
          Exec=/usr/bin/onPoint.AppImage
          Icon=onPoint
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF
          cat > "$ROOT/.PKGINFO" <<EOF
          pkgname = onpoint
          pkgver = ${VERSION}-1
          pkgdesc = onPoint - gerenciamento de ponto e frequencia
          url = https://github.com/${{ github.repository }}
          arch = x86_64
          license = custom
          EOF

          mkdir -p "$OUT_DIR"
          bsdtar -a -cf "$OUT_DIR/$RELEASE" -C "$ROOT" usr .PKGINFO
          echo "Pacote Arch gerado: $OUT_DIR/$RELEASE"
